name: Check shell script
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates shellcheck
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n ssh-manager.sh
      - name: ShellCheck
        run: shellcheck -S warning ssh-manager.sh
